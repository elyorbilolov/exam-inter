<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Exam</title>
    <link rel="stylesheet" href="style_v1.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=nuclear_v1').then(reg => {
                reg.update();
            });
        }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>English Exam</h1>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Qidirish...">
            </div>
            <div class="header-actions">
                <button id="print-pdf" class="action-header-btn" title="PDF orqali chop etish" aria-label="Print PDF">
                    📄
                </button>
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                    🌙
                </button>
            </div>
        </header>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <nav class="main-mode-nav">
            <button class="mode-btn active" data-mode="speaking">🗣️ Speaking</button>
            <button class="mode-btn" data-mode="writing">✍️ Writing</button>
        </nav>

        <section class="cards-wrapper" id="cards-wrapper">
            <nav class="cards-nav" id="cards-nav">
                <!-- Kartalar tugmalari JS orqali qo'shiladi -->
            </nav>
        </section>

        <section class="parts-wrapper">
            <nav class="parts-nav">
                <button class="part-btn active" data-part="Part 1">Part 1</button>
                <button class="part-btn" data-part="Part 2">Part 2</button>
            </nav>
        </section>

        <main id="content-area">
            <!-- Savollar shu yerga chiqadi -->
            <div id="loader" class="loader">Yuklanmoqda...</div>
        </main>
    </div>

    <script src="main_v1.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Exam v6.9</title>
    <link rel="stylesheet" href="style.css?v=v69">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js?v=v69').then(reg => {
                reg.update();
            });
        }
        function hardReset() {
            if(confirm("Barcha kesh va ma'lumotlar tozalanadi. Ishonchingiz komilmi?")) {
                localStorage.clear();
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(regs => {
                        for(let r of regs) r.unregister();
                        location.reload(true);
                    });
                } else {
                    location.reload(true);
                }
            }
        }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <button id="home-btn" class="action-header-btn" title="Dashboardga qaytish" style="display: none;">
                    🏠
                </button>
                <h1>English Exam</h1>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Qidirish...">
            </div>
            <div class="header-actions">
                <button onclick="hardReset()" class="action-header-btn" title="Keshni tozalash" style="background: rgba(244, 63, 94, 0.2); border-color: rgba(244, 63, 64, 0.3);">
                    🔄
                </button>
                <button id="print-pdf" class="action-header-btn" title="PDF orqali chop etish" aria-label="Print PDF">
                    📄
                </button>
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
                    🌙
                </button>
            </div>
        </header>

        <div id="level-selector" class="level-selector">
            <h2 class="level-select-title">Darajani tanlang / Choose your level</h2>
            <div class="level-cards">
                <button class="level-card-btn beginner" data-level="beginner">
                    <div class="level-icon">🌱</div>
                    <div class="level-info">
                        <span class="level-name">Beginner</span>
                        <span class="level-desc">Boshlang'ich daraja / Starter Level</span>
                    </div>
                    <div class="level-arrow">→</div>
                </button>
                <button class="level-card-btn elementary" data-level="elementary">
                    <div class="level-icon">🌿</div>
                    <div class="level-info">
                        <span class="level-name">Elementary</span>
                        <span class="level-desc">Elementary daraja / Basic English</span>
                    </div>
                    <div class="level-arrow">→</div>
                </button>
                <button class="level-card-btn pre-intermediate" data-level="pre-intermediate">
                    <div class="level-icon">📘</div>
                    <div class="level-info">
                        <span class="level-name">Pre-Intermediate</span>
                        <span class="level-desc">Pre-Intermediate daraja / Lessons</span>
                    </div>
                    <div class="level-arrow">→</div>
                </button>
                <button class="level-card-btn intermediate" data-level="intermediate">
                    <div class="level-icon">🎯</div>
                    <div class="level-info">
                        <span class="level-name">Intermediate</span>
                        <span class="level-desc">Intermediate daraja / B1 Level</span>
                    </div>
                    <div class="level-arrow">→</div>
                </button>
            </div>
        </div>

        <div id="main-content" style="display: none;">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <nav class="main-mode-nav">
                <button class="mode-btn active" data-mode="speaking">🗣️ Speaking</button>
                <button class="mode-btn" data-mode="writing">✍️ Writing</button>
                <button id="reading-mode-btn" class="mode-btn" data-mode="reading" style="display: none;">📖 Reading</button>
                <button id="listening-mode-btn" class="mode-btn" data-mode="listening" style="display: none;">🎧 Listening</button>
                <button id="lessons-mode-btn" class="mode-btn" data-mode="lessons" style="display: none;">📖 Lessons</button>
            </nav>

            <div class="study-tools-bar" id="study-tools-bar">
                <button id="flashcard-toggle" class="study-tool-btn" title="Flashcard rejimini yoqish/o'chirish">
                    <span class="tool-icon">🃏</span> Flashcards: OFF
                </button>
                <button id="keyword-blur-toggle" class="study-tool-btn" title="Kalit so'zlarni yashirish">
                    <span class="tool-icon">👁️</span> Hide Keywords: OFF
                </button>
            </div>

            <section class="cards-wrapper" id="cards-wrapper">
                <nav class="cards-nav" id="cards-nav">
                    <!-- Kartalar tugmalari JS orqali qo'shiladi -->
                </nav>
            </section>

            <section class="parts-wrapper">
                <nav class="parts-nav">
                    <button class="part-btn active" data-part="Part 1">Part 1</button>
                    <button class="part-btn" data-part="Part 2">Part 2</button>
                </nav>
            </section>

            <main id="content-area">
                <!-- Savollar shu yerga chiqadi -->
                <div id="loader" class="loader">Yuklanmoqda...</div>
            </main>
        </div>
    </div>

    <script src="script.js?v=v44"></script>
</body>
</html>
